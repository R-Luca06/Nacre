[workspace]
resolver = "3"
members = ["src-tauri", "cli"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
# Incremental caches grow by gigabytes; full rebuilds of this crate stay fast.
incremental = false

[profile.dev.package."*"]
debug = false
