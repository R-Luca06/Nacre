[package]
name = "nacre-app"
version = "0.1.0"
description = "Nacre terminal"
edition = "2024"

[lib]
name = "nacre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-clipboard-manager = "2.5.0"
libc = "0.2.191"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
notify = "8.2.1"
toml = "1.1.8"
toml_edit = "0.25.17"
tauri-plugin-notification = "2.7.0"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"
security-framework = "3.7.0"
